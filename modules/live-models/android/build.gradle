apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.livemodels'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

/** Dieselben Architekturen wie die App (gradle.properties `reactNativeArchitectures`). */
def liveModelsAbis() {
  def value = rootProject.findProperty("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

android {
  namespace "expo.modules.livemodels"
  ndkVersion rootProject.ext.has("ndkVersion") ? rootProject.ext.ndkVersion : null
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20 -fexceptions -frtti"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
    ndk {
      abiFilters(*liveModelsAbis())
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  // Die Schnittstelle für eigene Karten-Ebenen kommt als Prefab-Header mit
  // MapLibre (unser Fork, vendor/maplibre-native) — nur Header, kein Linken.
  buildFeatures {
    prefab true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Für das Auffinden der Karten-Ansicht (`UIManagerHelper`), wie expo-modules-core.
  implementation 'com.facebook.react:react-android'
  // Dieselbe MapLibre wie maplibre-react-native (plugins/withMaplibreGlobe.js).
  implementation "org.maplibre.gl:android-sdk-opengl:${rootProject.findProperty('org.maplibre.reactnative.nativeVersion') ?: '13.6.1-globe.6'}"
}
