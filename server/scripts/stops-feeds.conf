# Haltestellen-Quellen für den monatlichen Abgleich (scripts/refresh-stops.sh).
# Format: feed_id|url|land|code-präfix|aktiv(1/0)[|unstable]
# „unstable": Der Feed nummeriert jede Veröffentlichung neu (gtfs.de) — der
# Abgleich ordnet seine Halte dann über Name + Lage zu statt über die Kennung.
# Das Präfix MUSS zum bisherigen Import passen (package.json import:gtfs:*),
# sonst entstünden die Halte ein zweites Mal unter neuer Kennung.
# Kommt neu hinzu → nächster Lauf nimmt es auf (die Datei ist in den Container
# hineingereicht, kein Neubau nötig).

de|https://download.gtfs.de/germany/free/latest.zip|Germany|gtfs:de:|1|unstable
de-vbb|https://www.vbb.de/vbbgtfs|Germany|gtfs:de:vbb:|1
de-mvg|https://www.mvg.de/static/gtfs/google_transit.zip|Germany|gtfs:de:mvg:|1
de-vrs|https://download.vrsinfo.de/gtfs/google_transit.zip|Germany|gtfs:de:vrs:|1
# Österreich: alle Verbünde + Bahn (data.mobilitaetsverbuende.at, Konto in .env: MVO_USER/
# MVO_PASSWORD), zu EINEM Feed zusammengeführt (scripts/fetch-at-gtfs.ts) — enthält auch die
# Wiener Linien (bis Okt. 2026 eigene Zeile, dieselben Kennungen at:49:…). Lizenz: Quellenangabe
# in der App Pflicht (Profil → Support → Datenquellen).
at|mvo:52,53,54,55,56,57,58,69,66|Austria|gtfs:at:|1
fr|https://eu.ftp.opendatasoft.com/stif/GTFS/IDFM-gtfs.zip|France|gtfs:fr:|1
nl|https://gtfs.ovapi.nl/nl/gtfs-nl.zip|Netherlands|gtfs:nl:|1
ch|https://gtfs.geops.ch/dl/gtfs_complete.zip|Switzerland|gtfs:ch:|1
cz|https://data.pid.cz/PID_GTFS.zip|Czech Republic|gtfs:cz:|1
pl|https://mkuran.pl/gtfs/warsaw.zip|Poland|gtfs:pl:|1
be|https://gtfs.irail.be/nmbs/gtfs/latest.zip|Belgium|gtfs:be:|1
# Seit Sept. 2026 nicht mehr erreichbar (404) — neue Quelle suchen:
be-delijn|https://gtfs.irail.be/de-lijn/de_lijn-gtfs.zip|Belgium|gtfs:be:dl:|0
be-tec|https://gtfs.irail.be/tec/tec-gtfs.zip|Belgium|gtfs:be:tec:|0
