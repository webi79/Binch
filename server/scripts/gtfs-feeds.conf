# GTFS-Feeds für Auto-Refresh.
# Format: feed_id|url|active(1/0)
# Auskommentierte Lines (# am Anfang) werden ignoriert.
# active=0 → temporär aus der Rotation (Quelle defekt etc.).
#
# Update-Frequenz: einmal pro Woche via gtfs-refresh-Service im docker-compose.
# Wenn du eine neue URL findest, einfach hier eintragen — Container nimmt's beim
# nächsten Loop-Tick auf, kein Rebuild nötig.

nl-ovapi|https://gtfs.ovapi.nl/nl/gtfs-nl.zip|1
be-gtfs|https://gtfs.irail.be/nmbs/gtfs/latest.zip|1
cz-gtfs|https://data.pid.cz/PID_GTFS.zip|1
gb-gtfs|https://data.bus-data.dft.gov.uk/timetable/download/gtfs-file/all/|1
# FR-Feeds auf opendatasoft sind seit 2025-01 nicht aktualisiert. transport.data.
# gouv.fr braucht Registrierung — manuell URL holen und hier eintragen mit
# active=1.
fr-transport|https://eu.ftp.opendatasoft.com/sncf/gtfs/export-intercites-gtfs-last.zip|0
