# -----------------------------------------------------------------------------
# NODE_OPTIONS: --tls-cipher-list=<Chrome-Cipher-Liste>   (beide db-vendo-Sidecars)
#
# DB steht hinter Akamai, und das blockt nicht nach IP und nicht nach Header,
# sondern nach TLS-FINGERABDRUCK (JA3): Der ClientHello nennt seine Cipher-Suites
# in einer bestimmten Reihenfolge, und Nodes Default-Liste ist eine andere als die
# eines Browsers. Antwort: 403 {"code":"OPS_BLOCKED"} — egal welcher User-Agent,
# Referer, Origin. Genau darum sah es wie eine IP-Sperre aus: der Browser am selben
# Anschluss bekam Daten, unser Server nicht.
#
# Nachgemessen gegen int.bahn.de/web/api/reiseloesung/orte (13.07.2026):
#   curl (Default-Cipher)                → 403 OPS_BLOCKED
#   curl --http2 (Default-Cipher)        → 403 OPS_BLOCKED   ← es liegt NICHT an HTTP/2
#   curl --ciphers <Chrome> (HTTP/1.1)   → 200 ✓             ← es ist die Cipher-Liste
#   node https.get (Default)             → 403 OPS_BLOCKED
#   node https.get + ciphers: <Chrome>   → 200 ✓
#
# `--tls-cipher-list` ist in NODE_OPTIONS erlaubt und wirkt prozessweit, also auch
# im fetch von db-vendo-client. Kein Patch am Image nötig.
#
# Wir geben uns damit NICHT als jemand anderes aus — der User-Agent bleibt
# `binch-mobile/0.1`, wir sind für DB identifizierbar und halten das Ratelimit ein.
# Wir verhandeln lediglich dieselben (modernen, sicheren) TLS-Ciphers wie ein Browser.
# -----------------------------------------------------------------------------
x-chrome-tls: &chrome-tls
  NODE_OPTIONS: >-
    --tls-cipher-list=TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA:AES256-SHA

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: binch
      POSTGRES_PASSWORD: binch
      POSTGRES_DB: binch
    ports:
      - "5432:5432"
    volumes:
      - binch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binch -d binch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted db-vendo-client — Nachfolger von derhuerst/db-rest.
  # DB hat 2025/26 die alte HAFAS-API (app.vendo.noncd.db.de) abgeschaltet, der
  # db-vendo-client redet stattdessen mit dem neuen "vendo/movas"-Backend von
  # bahn.de / DB Navigator. Gleiche hafas-rest-api-Foundation → REST-Routen
  # (/stops/:id/departures, /locations/nearby) sind drop-in kompatibel.
  # Source: https://github.com/public-transport/db-vendo-client
  # Quota: ~60 req/min pro IPv4 — unser 60s-Cache + Coalescing in
  # stopInfoService halten uns weit drunter.
  #
  # Bedient DBREST_BASE_URL: Abfahrts-/Ankunftstafeln, Trip-Details,
  # /locations/nearby, Live-Positionen.
  dbrest:
    image: ghcr.io/public-transport/db-vendo-client:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      <<: *chrome-tls
      PORT: "3000"
      # War "db" (DB-Navigator + regio-guide-RIS). Dieses Profil ist TOT: sein
      # Backend app.services-bahn.de antwortet auch mit korrektem TLS-Fingerprint
      # nur noch {"message":"Unknown"} — der Endpoint /mob/location/search
      # existiert so nicht mehr.
      #
      # Die alte Begründung gegen "dbweb" („liefert Journeys OHNE Zeiten") war ein
      # Artefakt des Blocks: Über int.bahn.de kommen Journeys sehr wohl mit Zeiten,
      # Preisen, Gleisen und echten Zugnamen (13.07.2026 verifiziert).
      #
      # Warum das für die TAFELN zählt: Sie fielen ohne dbrest auf MOTIS/DELFI
      # zurück — und das meldet für Köln Hbf „Gleis 85-91" (real: 1-11). Über
      # dbweb steht dort jetzt „Gleis 5 D-G", „Gleis 11 B-C" — DBs eigene Werte.
      DB_PROFILE: "dbweb"
      USER_AGENT: "binch-mobile/0.1"

  # Zweiter db-vendo-client, gleiches Profil, eigener Prozess.
  #
  # Bedient DBWEB_BASE_URL: die SUCHE (Provider db-vendo) + Preis-Anreicherung der
  # MOTIS-Treffer + Recon-Token für den bahn.de-Direkt-Buchungslink.
  #
  # Getrennt vom dbrest-Container, damit eine hängende Such-Anfrage nicht die
  # Abfahrtstafeln mit blockiert (beide reden mit derselben API, aber ein
  # Node-Prozess arbeitet Requests seriell ab).
  dbweb:
    image: ghcr.io/public-transport/db-vendo-client:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      <<: *chrome-tls
      PORT: "3000"
      DB_PROFILE: "dbweb"
      USER_AGENT: "binch-mobile/0.1"

  # Backend-Server selbst als Container — vereint Restart-Logik (Docker
  # `restart: unless-stopped`) mit dem Rest des Stacks. Crash → Docker
  # startet automatisch neu. Reboot → Docker-Daemon startet beim Boot,
  # zieht alle Container hoch.
  binch-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Port 3000 direkt nach außen — NUR für lokalen Dev-Betrieb (LAN, Klartext).
    # Im Produktionsbetrieb hinter Caddy (Profil `tls`) diesen Block auskommentieren:
    # dann ist binch-server nur noch im Docker-Netz erreichbar, nach außen spricht
    # ausschließlich Caddy über 443 (HTTPS). Wer 3000 offen lässt, hat neben HTTPS
    # weiter einen offenen Klartext-Port — das untergräbt die Verschlüsselung.
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      dbrest:
        condition: service_started
      dbweb:
        condition: service_started
    # `.env` enthält alle Standard-Secrets (RAPIDAPI_KEY, JWT_SECRET, ...).
    # Hostnamen-spezifische Werte werden unten in `environment:` überschrieben,
    # da die in-Container-Hostnamen nicht localhost sind sondern die Service-
    # Namen aus dem Docker-Network.
    env_file: .env
    environment:
      # DB ist im Docker-Network unter dem Hostname `db` erreichbar — NICHT
      # localhost (das wäre der Container selbst).
      DATABASE_URL: postgres://binch:binch@db:5432/binch
      # db-vendo läuft intern auf Port 3000 (nicht 3001 wie extern gemapped).
      DBREST_BASE_URL: http://dbrest:3000
      DBWEB_BASE_URL: http://dbweb:3000
      NODE_ENV: production
      HOST: "0.0.0.0"
    # Memory-Cap als Schutz vor schleichenden Leaks. Wenn der Server
    # diese Grenze überschreitet, killt Docker den Container → `restart:
    # unless-stopped` startet ihn neu. `mem_limit` ist die Standalone-
    # Compose-Syntax (`deploy.resources.limits` wäre Swarm-only).
    mem_limit: 1g

  # Periodischer GTFS-Schedule-Refresh — re-importiert alle Feeds aus
  # `scripts/gtfs-feeds.conf` (NL/BE/CZ/GB, FR ist aktuell auf inactive).
  # Läuft als Sidecar im selben Image wie `binch-server` (hat tsx + scripts
  # + curl/unzip dabei). Endlos-Loop mit `sleep 604800` = 1 Woche.
  #
  # Wenn der Loop crashed (z.B. ein einzelner Feed-Download 500's), restart-
  # unless-stopped bringt's wieder hoch. import-gtfs-feed.sh purged pro
  # feed_id und re-inserts atomar — DB wächst nicht mit jeder Iteration.
  # VACUUM ANALYZE läuft am Ende jedes Refresh-Zyklus → kein Bloat.
  gtfs-refresh:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://binch:binch@db:5432/binch
      NODE_ENV: production
    # ./scripts ist im Image gebaked, aber wir cd'en explizit damit die
    # Pfade relativ stimmen. `|| true` damit ein einzelner Failure nicht
    # die ganze Loop kippt.
    command: ["sh", "-c", "cd /app && while true; do ./scripts/refresh-all-feeds.sh || true; echo 'Next refresh in 7 days…'; sleep 604800; done"]
    # Memory-Limit höher als binch-server weil GTFS-Imports mehrere Millionen
    # Rows in Batches laden — Node-Heap kann temporär 1-2 GB ziehen.
    mem_limit: 2g

  # OTP-Routing wurde versucht aber auf diesem Host (15 GB RAM) ist NL OVAPI
  # zu groß für den Graph-Build — der StopTimeMapper sprengt die JVM beim
  # Mapping der 841 MB stop_times-Tabelle (~10 GB Heap-Bedarf). Wir machen
  # stattdessen "Walk + Train Hybrid": non-Train-Origin findet nächsten
  # Bahnhof via DB, ab dort DB-HAFAS-Routing. Siehe transitSchedule provider.
  #
  # OTP-Setup kann aus git history wiederhergestellt werden falls wir mal
  # auf stärkere Hardware umziehen (>= 32 GB RAM).

  # ── TLS-Terminierung (Produktion) ──────────────────────────────────────────
  # Caddy nimmt HTTPS auf 443 an und proxyt intern zu binch-server:3000. Für eine
  # ECHTE Domain besorgt Caddy das Let's-Encrypt-Zertifikat vollautomatisch — es
  # ist nichts weiter zu tun, als DOMAIN zu setzen und die DNS-A-Record auf diesen
  # Host zeigen zu lassen.
  #
  # Damit ist die Server↔Client-Strecke verschlüsselt: Login-Passwort,
  # Bearer-Token, Suchen, Chat und Ticket-PDFs sind für Dritte im Netz nicht mehr
  # mitlesbar/manipulierbar (kein MITM mehr).
  #
  # Startet NUR mit dem Profil `tls` (`docker compose --profile tls up -d`), damit
  # der normale Dev-Start unverändert bleibt:
  #   DOMAIN=api.deine-domain.de docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Ohne gesetzte DOMAIN nutzt Caddy `localhost` → selbst-signiertes Zertifikat
      # (nur für lokale Tests; produktiv MUSS eine echte Domain gesetzt sein).
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      binch-server:
        condition: service_started

volumes:
  # `{}` = leeres Volume-Objekt mit Docker-Defaults (driver: local). Funktional
  # identisch zum bloßen `binch-db:` ohne Wert, aber strikte YAML-Schema-Linter
  # bemängeln den null-Wert. Mit explizitem `{}` ist die Warnung weg.
  binch-db: {}
  # Persistente Caddy-Zertifikate/ACME-Account — ohne das würde Caddy bei jedem
  # Neustart neu bei Let's Encrypt anfragen und liefe ins Rate-Limit.
  caddy-data: {}
  caddy-config: {}